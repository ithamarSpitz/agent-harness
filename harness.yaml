version: 5

execution:
  max_parallel_agents: 4  # the memory check still decides how many really start
  default_max_attempts: 3
  default_timeout_minutes: 35
  base_ref: null
  keep_successful_worktrees: false
  stall_timeout_minutes: 12
  watchdog_poll_seconds: 10
  keep_awake_during_run: true

worktree:
  setup_commands: []
  setup_timeout_minutes: 10

cursor:
  enabled: true
  command: agent
  output_format: stream-json
  trust_harness_worktrees: true
  # Named models; Auto implements in their place only while both Cursor pools are at 100% (never reviews).
  auto_when_exhausted: true
  models:
    worker: composer-2.5
    hard_worker: cursor-grok-4.6-high
    reviewer: cursor-grok-4.6-high
    escalation: claude-opus-5-thinking-high


claude:
  # On from S9 stage 6 (user, Nov 4 2026).
  enabled: true
  # 5-hour cap: 60% if another provider is back within 1h, 90% if not for 5h or more, linear between.
  # Weekly cap: 100 - 7% per day until the weekly reset.
  reserve:
    min_percent: 60
    max_percent: 90
    min_hours: 1
    max_hours: 5
    weekly_percent_per_day: 7

self_hosting:
  enabled: true

providers:
  priority:
    - agy
    - codex
    - cursor
    - claude

agy:
  enabled: true

codex:
  enabled: true
  command: codex
  reasoning_effort: high
  sandbox: workspace-write
  windows_implementation_sandbox: danger-full-access
  approval_policy: never
  network_access: true
  implementation_sequence:
    - model: gpt-5.6-sol
      reasoning_effort: medium
    - model: gpt-5.6-sol
      reasoning_effort: high
    - model: gpt-6-astra
      reasoning_effort: medium
  review_model: gpt-5.6-sol
  planner_model: gpt-5.6-sol

retry:
  # Cursor ladder stays on Cursor-native models (Composer, Grok); Opus is billed as Other Models.
  sequence:
    - worker
    - hard_worker
    - hard_worker

verification:
  global_task_commands:
    - git diff --check
  stage_commands:
    - python -m pytest -q tests/harness
    - python -m ruff check harness tests
    - python -m mypy harness

paths:
  protected:
    - harness.yaml
    - tasks/**
    - AGENTS.md
    - HARNESS-OPERATOR.md
  review_required:
    - pyproject.toml
    - schemas/**

context:
  aliases:
    readme: README.md
    operator: HARNESS-OPERATOR.md
    spec: SPEC.md

environment:
  docker_enabled: false

quota:
  policy: wait
  reset_at: null
  probe_interval_minutes: 60
  reset_grace_minutes: 5
  keep_awake: true
  teardown_environment_while_waiting: true
  exhaustion_patterns:
    - "usage limit reached"
    - "you've hit your usage limit"
    - "you have hit your usage limit"
    - "out of included usage"
    - "monthly usage limit"
    - "quota exceeded"
    - "spending limit reached"
    - "no usage remaining"
    - "you're out of usage"
    - "you’re out of usage"
    - "increase limits for faster responses"

capacity:
  policy: wait
  retry_interval_minutes: 5
  network_patterns:
    - "connection failed"
    - "connection lost"
    - "connection reset"
    - "network error"
    - "transport error"
    - "websocket"
    - "econnrefused"
    - "econnreset"
    - "etimedout"
    - "enotfound"
    - "eai_again"
    - "getaddrinfo"
    - "[unavailable]"
    - "nghttp2"
    - "stream closed"
  keep_awake: true
  teardown_environment_while_waiting: true

plan_repair:
  enabled: true
  planner_model_class: hard_worker
  timeout_minutes: 20

doctor:
  required_commands:
    - python
    - git
    - codex
  required_env: []
  min_free_disk_gb: 2
  check_cursor_models: true

# After a sprint passes: publish and install the new version, so every project uses it at once.
release:
  commands:
    - python scripts/bump_version.py
    - 'git commit -m "release: bump version" -- harness/__init__.py'
    - git push origin HEAD
    - python -m pip install --user --no-deps --force-reinstall .
