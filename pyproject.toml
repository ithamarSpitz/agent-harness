[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
dynamic = ["version"]
description = "Runs Codex and Cursor coding agents through a planned roadmap of tasks in any Git repo"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.11,<2", "types-PyYAML>=6,<7"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness"]

[tool.setuptools.dynamic]
version = { attr = "harness.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
